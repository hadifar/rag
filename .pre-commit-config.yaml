default_install_hook_types: [pre-commit, commit-msg, pre-push, post-checkout]

repos:
  # Enforce Conventional Commits on the commit message
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Enforce gitflow: master/dev only accept merges, other branches must
  # follow the feat/fix/refactor/docs/chore/release/hotfix naming convention.
  - repo: https://github.com/hadifar/precommit-gitguard
    rev: v0.1.3
    hooks:
      - id: no-direct-commit
      - id: no-direct-push
      - id: branch-name
      - id: stale-branch

  # Keeps uv.lock in sync with pyproject.toml — auto-fixes locally (rerun `git add` + commit),
  # like ruff --fix below.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.17
    hooks:
      - id: uv-lock
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # tests/unit is fast and has no external dependencies
      - id: pytest-unit
        name: pytest (tests/unit)
        entry: uv run pytest tests/unit
        language: system
        pass_filenames: false
        stages: [pre-commit]

      # Keeps frontend/src/types/api.generated.ts in sync with the backend's
      # Pydantic schemas — auto-fixes locally (rerun `git add` + commit), like uv-lock above.
      - id: frontend-api-types
        name: frontend API types match backend schema
        entry: bash scripts/generate_frontend_types.sh
        language: system
        pass_filenames: false
        files: ^(rag/api/schema\.py|rag/api/routers/.*\.py|frontend/src/types/api\.generated\.ts)$
        stages: [pre-commit]



  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
            args: [--maxkb=1000]
          - id: check-merge-conflict
          - id: debug-statements
            name: pre-commit general file check



  # Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        name: ruff
        stages: [pre-commit]

  # type checking via pyright
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        name: "🐍 python · Check types"
        stages: [pre-push]
