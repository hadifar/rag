default_install_hook_types: [pre-commit, commit-msg, pre-push, post-checkout]

repos:
  # Enforce Conventional Commits on the commit message
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.18.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # Enforce gitflow: master/dev only accept merges, other branches must
  # follow the feat/fix/refactor/docs/chore/release/hotfix naming convention.
  - repo: local
    hooks:
      - id: gitflow-commit-guard
        name: gitflow commit guard
        entry: scripts/git-hooks/pre-commit
        language: script
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-commit]

      - id: gitflow-guard
        name: gitflow branch/push guard
        entry: scripts/git-hooks/pre-push
        language: script
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: stale-branch-warning
        name: stale master/dev warning
        entry: scripts/git-hooks/post-checkout
        language: script
        pass_filenames: false
        always_run: true
        stages: [post-checkout]

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-commit]

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-added-large-files
          - id: check-merge-conflict
          - id: debug-statements
            name: pre-commit general file check



  # Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
        name: ruff
        stages: [pre-commit]

  # type checking via pyright
  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.414
    hooks:
      - id: pyright
        name: "🐍 python · Check types"
        stages: [pre-push]
