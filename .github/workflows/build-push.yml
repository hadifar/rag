name: build-push

# Manual: nothing deploys these images yet (see docs/limitation.md), so builds aren't
# tied to every push to master. Re-run manually once you want a new prod image.
on:
  workflow_dispatch:

permissions:
  id-token: write   # required for azure/login's OIDC federated credential
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: echo "value=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.backend
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/rag-backend:${{ steps.version.outputs.value }}
            ${{ vars.ACR_NAME }}.azurecr.io/rag-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ vars.ACR_NAME }}.azurecr.io/rag-frontend:${{ steps.version.outputs.value }}
            ${{ vars.ACR_NAME }}.azurecr.io/rag-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
