name: integration-tests

on:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    # Job-level: alembic's env.py loads the full Settings too, not just the tests.
    env:
      LLM__BACKEND: openai
      LLM__API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM__MODEL: ${{ vars.OPENAI_MODEL }}

      DATABASE__PASSWORD: rag
      DATABASE__SSLMODE: disable   # the throwaway service container has no TLS
      AUTH__JWT_SECRET: ci-integration-unused-jwt-secret-000000
    # build_container opens its Postgres pools, so the tests need a reachable Postgres.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: rag
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: astral-sh/setup-uv@v10.1.0

      - name: Install dependencies
        run: uv sync --group dev

      # Creates the users/conversations/chunks tables the tests run against.
      - name: Apply database migrations
        run: uv run alembic upgrade head

      - name: Run integration tests
        run: uv run pytest tests/integration
