name: bump-version

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  bump:
    # skip commits made by the bump step itself, to avoid an infinite loop
    if: "!contains(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and push tag
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: true
          push: true

      # commitizen-action runs in its own Docker container with no uv, so uv.lock can't be
      # synced via pyproject.toml's pre_bump_hooks — do it here on the runner instead.
      - uses: astral-sh/setup-uv@v10.1.0

      # commitizen-action's container runs as root and writes to .git during its own commit,
      # leaving .git internals (e.g. COMMIT_EDITMSG) root-owned — reclaim them before the
      # runner's own user (not root) tries to commit again below.
      - name: Reclaim workspace ownership from the commitizen-action container
        run: sudo chown -R "$(id -u):$(id -g)" .

      - name: Sync uv.lock with the bumped version
        run: |
          uv lock
          if ! git diff --quiet uv.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock
            git commit -m "chore: sync uv.lock after version bump [skip ci]"
            git push
          fi
