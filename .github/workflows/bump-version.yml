name: bump-version

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  bump:
    # skip commits made by the bump step itself, to avoid an infinite loop
    if: "!contains(github.event.head_commit.message, 'bump:')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version and push tag
        uses: commitizen-tools/commitizen-action@0.27.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          changelog: true
          push: true

      # commitizen-action runs in its own Docker container with no uv/node, so derived files
      # can't be synced via pyproject.toml's pre_bump_hooks — do it here on the runner instead.
      - uses: astral-sh/setup-uv@v10.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # commitizen-action's container runs as root and writes to .git during its own commit,
      # leaving .git internals (e.g. COMMIT_EDITMSG) root-owned — reclaim them before the
      # runner's own user (not root) tries to commit again below.
      - name: Reclaim workspace ownership from the commitizen-action container
        run: sudo chown -R "$(id -u):$(id -g)" .

      # frontend/package.json's version is set directly here — not via commitizen's
      # `version_files`, which patches a file by finding its OLD version string and replacing
      # it. Once that file's version ever drifted from pyproject.toml's (which it did,
      # permanently, the first time they were set independently), that string-match can never
      # succeed again, so it silently stops updating forever. Writing it unconditionally with
      # `npm version` every bump makes drift structurally impossible instead of relying on the
      # two files staying byte-for-byte in sync between runs.
      - name: Sync derived files with the bumped version
        run: |
          uv lock
          new_version="$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)"
          npm --prefix frontend version "$new_version" --no-git-tag-version --allow-same-version
          if ! git diff --quiet uv.lock frontend/package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add uv.lock frontend/package.json
            git commit -m "chore: sync uv.lock and frontend/package.json after version bump [skip ci]"
            git push
          fi
