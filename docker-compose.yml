services:
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file: .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
