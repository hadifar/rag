services:
  postgres:
    # Postgres with the pgvector extension
    image: pgvector/pgvector:pg17
    # prod gets DATABASE_URL from Key Vault.
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    env_file: .env
    # .env targets the host (localhost); inside the compose network it's `postgres`.
    environment:
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
      # Uploaded knowledge-base zips, kept on a volume so they survive rebuilds.
      KB_STORAGE__BACKEND: local
      KB_STORAGE__DIR: /var/lib/rag/uploads
    volumes:
      - kbuploads:/var/lib/rag/uploads
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
  kbuploads:
