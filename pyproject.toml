[project]
name = "RAG"
version = "0.12.0"
description = "A ready to use RAG!"
readme = "README.md"
license = "MIT"

authors = [{ name = "hadifar" }]

requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.11",
    "langchain-openai>=1.6.2",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
    "langfuse>=4.15.2",
    "langchain>=1.4.0",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt>=2.10.1",
    "argon2-cffi>=25.1.0",
    "alembic>=1.16.5",
    "sqlalchemy>=2.0.44",
    "azure-storage-blob[aio]>=12.30.3",
    "azure-identity>=1.25.3",
    "python-multipart>=0.0.32",
]

[project.urls]
Homepage = "https://github.com/hadifar/rag"

[project.scripts]
rag = "rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true  # only the preview rules named below
select = ["E4", "E7", "E9", "F"]  # the stable defaults; preview would otherwise widen them
extend-select = [
    "C901", "B", "SIM", "C4", "RET", "UP", "ERA", "PLR2004", "PTH", "ASYNC",
    "FAST",  # FastAPI: Annotated dependencies, no redundant response_model
    "T20",   # no print(); the CLI talks through typer.echo
    "TID251",  # banned APIs, below
    "RUF006",  # keep a reference to create_task(), or the task can be GC'd mid-flight
    "RUF012",  # mutable class attributes are shared by every instance
    "BLE001", "S110",  # no blind `except Exception`, no try/except/pass
    "PERF",  # slow loop patterns
    "PT",  # pytest style: raises() with match, one condition per assert
    "PLR0911", "PLR0913", "PLR0915",  # complexity: returns, arguments, statements
    "PLR0904", "PLR0914", "PLR0916", "PLR1702",  # preview: public methods, locals, bool-expr, nesting
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi.HTTPException".msg = "Raise a rag.domain.errors.AppError subclass"
"os.environ".msg = "Read configuration through rag.config.Settings."
"os.getenv".msg = "Read configuration through rag.config.Settings."
"os.path".msg = "use Pathlib"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "TID251"]  # tests may read the environment (e.g. CI)
"scripts/**" = ["T20"]  # scripts write their output to stdout

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.pylint]
max-args = 5
max-returns = 5
max-statements = 20
max-nested-blocks = 3
max-locals = 8
max-bool-expr = 3
max-public-methods = 12  # AuthService has 12: split a service before it grows past this

[tool.commitizen]
name = "cz_conventional_commits"
version_scheme = "semver2"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
version_provider = "pep621"

[tool.pyright]
typeCheckingMode = "basic"
# Strict everywhere but rag/services, where LangChain's partly untyped API leaks in.
strict = [
    "rag/domain", "rag/api", "rag/repository", "rag/adapters",
    "rag/app.py", "rag/cli.py", "rag/config", "rag/container.py", "rag/__main__.py",
]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits real Postgres/LLM"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "commitizen",
    "import-linter>=2.15",
    "pre-commit",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff",
]

[tool.importlinter]
root_package = "rag"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "domain is pure"
type = "forbidden"
source_modules = ["rag.domain"]
forbidden_modules = ["rag.services", "rag.adapters", "rag.repository", "rag.api", "rag.container", "rag.app", "rag.cli", "langchain_core", "langchain", "langgraph"]

[[tool.importlinter.contracts]]
name = "services do not import adapters, entrypoints, or the api layer directly"
type = "forbidden"
source_modules = ["rag.services"]
forbidden_modules = ["rag.adapters", "rag.repository", "rag.container", "rag.app", "rag.cli", "rag.api"]

[[tool.importlinter.contracts]]
name = "LangChain is used only by the agent service (and adapters); others call it through AgentServicePort"
type = "forbidden"
source_modules = ["rag.services", "rag.api", "rag.app", "rag.cli"]
forbidden_modules = [
    "langchain_core", "langchain", "langchain_openai", "langchain_protocol",
    "langgraph", "langgraph_sdk", "langsmith",
]

# Direct imports only: the api and entrypoints reach LangChain through the agent
# service and the container's adapters, which is how it's meant to be.
allow_indirect_imports = "true"
ignore_imports = [
    "rag.services.agent_service.** -> langchain_core",
    "rag.services.agent_service.** -> langchain",
    "rag.services.agent_service.** -> langgraph",
]

[[tool.importlinter.contracts]]
name = "repository reaches only the domain"
type = "forbidden"
source_modules = ["rag.repository"]
forbidden_modules = ["rag.services", "rag.adapters", "rag.api", "rag.container", "rag.app", "rag.cli", "langchain_core", "langchain", "langgraph"]

[[tool.importlinter.contracts]]
name = "only the composition root constructs adapters or repositories"
type = "forbidden"
source_modules = ["rag.api", "rag.app", "rag.cli"]
forbidden_modules = ["rag.adapters", "rag.repository"]
ignore_imports = ["rag.container -> rag.adapters.**", "rag.container -> rag.repository.**"]

[[tool.importlinter.contracts]]
name = "api does not import entrypoints"
type = "forbidden"
source_modules = ["rag.api"]
forbidden_modules = ["rag.app", "rag.cli"]

[[tool.importlinter.contracts]]
name = "only deps reaches services and the container directly"
type = "forbidden"
source_modules = ["rag.api"]
forbidden_modules = ["rag.container", "rag.services"]
allow_indirect_imports = "true"
ignore_imports = [
    "rag.api.deps -> rag.container",
    "rag.api.deps -> rag.services.**",
]

[[tool.importlinter.contracts]]
name = "api routers reach the domain and config only through deps and schema"
type = "forbidden"
source_modules = ["rag.api.routers"]
forbidden_modules = ["rag.domain", "rag.config"]
allow_indirect_imports = "true"

[[tool.importlinter.contracts]]
name = "routers are independent of each other"
type = "independence"
modules = ["rag.api.routers.*"]

[[tool.importlinter.contracts]]
name = "services are independent of each other: they meet only through rag.domain ports"
type = "independence"
modules = ["rag.services.*"]

[[tool.importlinter.contracts]]
name = "layering"
type = "layers"
layers = [
    "rag.api",
    "rag.services",
    "rag.domain",
]
